# Every push and pull request runs the full check: data validation, types, lint, format,
# unit and smoke tests, and the browser suite (pixel and DOM parity with legacy v0.990,
# backups, offline). The GitHub Pages build is made every time, so a broken build shows up on
# a branch; it is deployed only from main.
#
# Deploying needs the repository's Pages source set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
name: Check and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Data validation
        run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - name: Unit, smoke and data tests
        run: npm test
      - name: Parity with legacy v0.990, backups, offline
        run: npm run test:visual
      - name: Keep the screenshots and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parity-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Build for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /tennisdb/
      - if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v6
      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
